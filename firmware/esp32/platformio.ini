; AquaSense AI - firmware ESP32 (FEBRACE)
; Compilacao: pio run -d firmware/esp32
; Upload:     pio run -d firmware/esp32 -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.8

build_flags =
    -DCORE_DEBUG_LEVEL=0
