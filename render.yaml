# Render Blueprint - deploy em 1 clique do site AquaSense AI (backend + dashboard).
# Como usar: https://dashboard.render.com -> "New" -> "Blueprint" -> selecione o repositorio.
# Plano gratuito: o servico "dorme" apos ~15 min sem acesso e acorda sozinho (~60 s).
#
# IMPORTANTE: O Postgres free do Render expira em 30 dias. Para persistencia
# permanente e gratuita, use um banco externo (Neon/Supabase) e defina
# DATABASE_URL manualmente no Dashboard do Render apos o primeiro deploy.
# Veja docs/migracao-neon.md para o passo a passo completo.
services:
  - type: web
    name: aquasense-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Chave usada pelo ESP32 real e pelo treino via API. Voce pode definir
      # seu proprio valor aqui; se deixar como generateValue, consulte em
      # Render Dashboard -> Environment.
      - key: API_KEY
        generateValue: true
      # Simulador DEMO ao vivo: gera leituras novas periodicas (MOCK) para o
      # dashboard mostrar dados chegando em tempo real.
      # DEMO (MOCK): 1 para apresentacao sem ESP32, 0 em producao com dado real/ESP32.
      - key: DEMO_SIMULATOR_ENABLED
        value: "1"
      - key: DEMO_SIMULATOR_INTERVAL_SEC
        value: "40"
      - key: DEMO_SIMULATOR_ANOMALY_PROB
        value: "0.02"
      # Restrito: dominio real do Render + desenvolvimento local.
      # Para feira local com ESP32, o firmware usa IP local (CORS nao se aplica ao ESP32, apenas ao browser).
      - key: CORS_ORIGINS
        value: "https://aquasense-ai-fokz.onrender.com,http://localhost:5173,http://localhost:8000"
      - key: ENV
        value: "production"
      # DATABASE_URL: definir manualmente no Render Dashboard com a URL do Neon
      # (formato postgresql://user:pass@host/db). Se vazio, usa SQLite efemero.
      # O simulador desliga automaticamente quando o ESP32 real (AQUASENSE-001) envia dados.
