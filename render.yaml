# Render Blueprint - deploy em 1 clique do site AquaSense AI (backend + dashboard).
# Como usar: https://dashboard.render.com -> "New" -> "Blueprint" -> selecione o repositorio.
# Plano gratuito: o servico "dorme" apos ~15 min sem acesso e acorda sozinho (~30 s).
services:
  - type: web
    name: aquasense-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Chave usada pelo ESP32 real e pelo treino via API. Voce pode definir
      # seu proprio valor aqui; se deixar como generateValue, consulte em
      # Render Dashboard -> Environment.
      - key: API_KEY
        generateValue: true
      # Simulador DEMO ao vivo: gera leituras novas periodicas (MOCK) para o
      # dashboard mostrar dados chegando em tempo real.
      # DEMO (MOCK): 1 para apresentacao sem ESP32, 0 em producao com dado real/ESP32.
      - key: DEMO_SIMULATOR_ENABLED
        value: "1"
      - key: DEMO_SIMULATOR_INTERVAL_SEC
        value: "40"
      - key: DEMO_SIMULATOR_ANOMALY_PROB
        value: "0.02"
      # Restrito: adicione o dominio real do Render apos o primeiro deploy.
      # Para feira local com ESP32, o firmware usa IP local (CORS nao se aplica ao ESP32, apenas ao browser).
      - key: CORS_ORIGINS
        value: "https://aquasense-ai.onrender.com,http://localhost:5173,http://localhost:8000"
      - key: ENV
        value: "production"
      # Persistencia: SQLite no plano free e efemero (perde dados a cada restart/sleep).
      # DATABASE_URL injeta a connectionString do Postgres abaixo (psycopg). Para dado
      # cientifico real, mantenha; para demo MOCK pura, pode remover o bloco databases.
      # Com dado real, ajuste DEMO_SIMULATOR_ENABLED=0 no Dashboard do Render.
      - key: DATABASE_URL
        fromDatabase:
          name: aquasense-db
          property: connectionString
databases:
  - name: aquasense-db
    plan: free
    databaseName: aquasense
    user: aquasense
