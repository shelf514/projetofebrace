services:
  backend:
    image: python:3.14-slim
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DATABASE_URL=postgresql+psycopg://aquasense:aquasense@db:5432/aquasense
      - API_KEY=change-me
      - DEMO_SIMULATOR_ENABLED=1
      - DEMO_SIMULATOR_INTERVAL_SEC=40
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:22-slim
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=aquasense
      - POSTGRES_PASSWORD=aquasense
      - POSTGRES_DB=aquasense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquasense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
