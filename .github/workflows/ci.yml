name: CI

# Checagens rapidas de backend, frontend e firmware a cada push/PR.
# O build do APK continua em .github/workflows/build-apk.yml (manual / tag).

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt

      - name: Pytest
        working-directory: backend
        run: |
          python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Tests
        working-directory: frontend
        run: npm test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (PlatformIO)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Provide placeholder secrets.h (CI only, nao versionado)
        run: cp firmware/esp32/include/secrets.example.h firmware/esp32/include/secrets.h

      - name: Build firmware (esp32dev)
        run: python -m platformio run -d firmware/esp32
