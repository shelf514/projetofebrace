name: Build APK Android

# Gera o APK do dashboard na nuvem (sem precisar de Android SDK no PC).
# - Disparo manual: Actions -> "Build APK Android" -> "Run workflow".
#   Publica o APK na Release "nightly" (link permanente de download).
# - Push de tag v*: publica o APK na Release da tag.
#
# Variavel do repositorio (Settings -> Secrets and variables -> Actions -> Variables):
#   APK_API_URL = URL do backend que o APK usara por padrao,
#   ex.: https://aquasense-ai.onrender.com
#   (Sem ela, o app usa http://localhost:8000.)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web + sync Capacitor
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.APK_API_URL }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK (assembleDebug)
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
        # TODO (P1): APK release assinado — configurar secrets ANDROID_KEYSTORE_BASE64 /
        # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_STORE_PASSWORD e trocar por
        # assembleRelease + assinatura (apksigner). Debug permite repack; nao publicar na Play.

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aquasense-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="nightly"; fi
          TITLE="AquaSense AI APK ($TAG)"
           NOTES="APK do dashboard AquaSense AI. O endereco do backend e definido no build (APK_API_URL)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" frontend/android/app/build/outputs/apk/debug/*.apk --clobber
          else
            gh release create "$TAG" frontend/android/app/build/outputs/apk/debug/*.apk \
              --title "$TITLE" --notes "$NOTES"
          fi
